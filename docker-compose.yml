services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JUDGE_MOCK: "0"
      JUDGE_MODEL: gemini-3.5-flash-lite
      AUDIT_MODEL: gemini-3.8-flash
      # Demo setting: keep this explicit so a server .env value cannot silently restore the production delay.
      ESCROW_HOLD_SECONDS: "60"
    expose:
      - "3000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  caddy_data:
  caddy_config:
