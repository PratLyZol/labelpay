name: Probe Cortex models on server

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated model list (optional)"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
          HOST: ${{ secrets.VULTR_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Run probe
        env:
          HOST: ${{ secrets.VULTR_HOST }}
          MODELS: ${{ github.event.inputs.models }}
        run: |
          ssh -i ~/.ssh/deploy_key "root@$HOST" \
            "cd /opt/labelpay && docker compose exec -T -e PROBE_MODELS='$MODELS' app node node_modules/tsx/dist/cli.mjs scripts/cortex-probe.ts </dev/null"
