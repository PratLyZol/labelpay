name: Deploy to Vultr

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
          HOST: ${{ secrets.VULTR_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull, rebuild, migrate, route
        env:
          HOST: ${{ secrets.VULTR_HOST }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "root@$HOST" \
            "cd /opt/labelpay && git fetch --quiet origin $SHA && git reset --hard $SHA --quiet && bash deploy/update.sh"

      - name: Smoke check
        env:
          HOST: ${{ secrets.VULTR_HOST }}
          DOMAIN: ${{ secrets.VULTR_DOMAIN }}
        run: |
          DOMAIN=${DOMAIN:-$HOST.sslip.io}
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMAIN/api/stats" || true)
            [ "$code" = "200" ] && echo "ok: /api/stats 200" && exit 0
            sleep 3
          done
          echo "site did not come back"; exit 1
