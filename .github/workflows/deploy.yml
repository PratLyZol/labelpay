name: Deploy to Vultr

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
          HOST: ${{ secrets.VULTR_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull, rebuild, migrate, route
        env:
          HOST: ${{ secrets.VULTR_HOST }}
          SHA: ${{ github.sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY secret is missing"; exit 1; fi
          printf '%s\n' "$GEMINI_API_KEY" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "root@$HOST" \
            "IFS= read -r GEMINI_API_KEY && export GEMINI_API_KEY && cd /opt/labelpay && git fetch --quiet origin $SHA && git reset --hard $SHA --quiet && bash deploy/update.sh"

      - name: Smoke check
        env:
          HOST: ${{ secrets.VULTR_HOST }}
          DOMAIN: ${{ secrets.VULTR_DOMAIN }}
        run: |
          DOMAIN=${DOMAIN:-$HOST.sslip.io}
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMAIN/api/stats" || true)
            if [ "$code" = "200" ]; then
              body=$(curl -fsS "https://$DOMAIN/api/stats")
              if echo "$body" | jq -e '.judge.mock == false and (.judge.model | startswith("gemini-"))' >/dev/null; then
                echo "ok: Gemini judge active"; exit 0
              fi
            fi
            sleep 3
          done
          echo "site did not come back"; exit 1
